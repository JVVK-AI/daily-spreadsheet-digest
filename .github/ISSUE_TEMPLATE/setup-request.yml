name: Request a scoped setup
description: Describe a possible paid setup or customization for Daily Spreadsheet Digest.
title: "Setup request: "
labels: ["setup-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe a possible scoped setup or customization. Do not include credentials, private spreadsheet data, personal access tokens, or confidential customer information. A request is not an agreement to perform work, price, or timeline.
  - type: dropdown
    id: request_type
    attributes:
      label: What do you need?
      options:
        - Install the standard daily digest in an existing spreadsheet
        - Adjust columns, date matching, or email format
        - Add an approval or review step
        - Connect a different source or delivery channel
        - Something else
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you need without sharing private data.
    validations:
      required: true
  - type: input
    id: timeline
    attributes:
      label: Desired timeline
      placeholder: Example: within two weeks
  - type: input
    id: budget
    attributes:
      label: Budget range (optional)
      placeholder: Example: USD 75–150
  - type: checkboxes
    id: boundaries
    attributes:
      label: Before submitting
      options:
        - label: I understand this public issue must not contain credentials, private spreadsheet data, or confidential information.
          required: true
        - label: I understand that scope, price, access, and delivery must be agreed separately before any work begins.
          required: true

